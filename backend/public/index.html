<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGA en pausa</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0b16;
      color: #f5eefc;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 520px;
      padding: 32px;
      border: 1px solid #3b2d4a;
      border-radius: 22px;
      background: #171120;
    }

    p {
      color: #b9a9cc;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SIGA está en pausa</h1>
    <p>Este proyecto fue guardado temporalmente por mantenimiento.</p>
  </div>
</body>
</html>
